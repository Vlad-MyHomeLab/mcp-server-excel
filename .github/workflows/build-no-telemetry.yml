name: Build no-telemetry Windows MCP

on:
  push:
    branches: [no-telemetry]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build win-x64 self-contained MCP
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Publish and verify no-telemetry artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet --version
          dotnet publish src/ExcelMcp.McpServer/ExcelMcp.McpServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:NoTelemetry=true -o artifacts/no-telemetry/publish --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }

          $assetsPath = 'src/ExcelMcp.McpServer/obj/project.assets.json'
          if (-not (Test-Path -LiteralPath $assetsPath -PathType Leaf)) { throw "Restore assets missing: $assetsPath" }
          $assets = Get-Content -LiteralPath $assetsPath -Raw | ConvertFrom-Json
          $dependencyNames = @($assets.libraries.PSObject.Properties.Name)
          $applicationInsightsPackages = @($dependencyNames | Where-Object { $_ -match '^Microsoft\.ApplicationInsights' })
          if ($applicationInsightsPackages.Count -ne 0) {
            throw "Application Insights packages remain in the no-telemetry dependency graph: $($applicationInsightsPackages -join ', ')"
          }
          $telemetryConfigs = @(Get-ChildItem src/ExcelMcp.McpServer/obj -Filter TelemetryConfig.g.cs -File -Recurse -ErrorAction SilentlyContinue)
          if ($telemetryConfigs.Count -ne 0) { throw 'No-telemetry build unexpectedly generated TelemetryConfig.g.cs.' }

          $publishedExe = 'artifacts/no-telemetry/publish/Sbroenne.ExcelMcp.McpServer.exe'
          if (-not (Test-Path -LiteralPath $publishedExe -PathType Leaf)) { throw "Published apphost missing: $publishedExe" }
          $publishedText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($publishedExe))
          if ($publishedText.Contains('Microsoft.ApplicationInsights')) { throw 'Published executable contains an Application Insights SDK assembly or symbol.' }
          if ($publishedText.Contains('api.github.com/repos/sbroenne/mcp-server-excel/releases/latest')) { throw 'Published executable contains the GitHub version-check endpoint.' }

          $proxyListener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $proxyListener.Start()
          $proxyPort = ([Net.IPEndPoint]$proxyListener.LocalEndpoint).Port
          $proxyNames = @('HTTP_PROXY', 'HTTPS_PROXY', 'ALL_PROXY', 'NO_PROXY')
          $previousProxyValues = @{}
          foreach ($proxyName in $proxyNames) { $previousProxyValues[$proxyName] = [Environment]::GetEnvironmentVariable($proxyName, 'Process') }
          try {
            $localProxy = "http://127.0.0.1:$proxyPort"
            $env:HTTP_PROXY = $localProxy
            $env:HTTPS_PROXY = $localProxy
            $env:ALL_PROXY = $localProxy
            $env:NO_PROXY = ''
            $versionOutput = & $publishedExe --version 2>&1
            $versionExitCode = $LASTEXITCODE
            $versionText = $versionOutput -join "`n"
            if ($versionExitCode -ne 0) { throw "--version exited with code $versionExitCode. Output: $versionText" }
            if ($versionText -notmatch '(?m)^Excel MCP Server v\d+\.\d+') { throw "--version did not print the current server version. Output: $versionText" }
            if ($versionText -match 'Update available:') { throw "--version unexpectedly printed update information. Output: $versionText" }
            Start-Sleep -Milliseconds 200
            if ($proxyListener.Pending()) { throw '--version attempted an outbound request through the local proxy.' }
          }
          finally {
            foreach ($proxyName in $proxyNames) { [Environment]::SetEnvironmentVariable($proxyName, $previousProxyValues[$proxyName], 'Process') }
            $proxyListener.Stop()
          }

          $packageDir = 'artifacts/no-telemetry/package'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -LiteralPath $publishedExe -Destination (Join-Path $packageDir 'mcp-excel.exe')
          Copy-Item -LiteralPath 'src/ExcelMcp.McpServer/README.md' -Destination (Join-Path $packageDir 'README.md')
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $packageDir 'LICENSE')
          $entries = @(Get-ChildItem -LiteralPath $packageDir -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedEntries = @('LICENSE', 'README.md', 'mcp-excel.exe')
          if (Compare-Object $expectedEntries $entries) { throw "Unexpected package contents: $($entries -join ', ')" }

          $zipName = 'mcp-excel-no-telemetry-win-x64.zip'
          $zipPath = Join-Path 'artifacts/no-telemetry' $zipName
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) { throw 'Package ZIP was not created.' }
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zipPath.sha256" -Value "$hash  $zipName" -Encoding ascii
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "ZIP SHA-256: $hash"

      - name: Upload custom runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: excelmcp-no-telemetry-win-x64
          path: |
            artifacts/no-telemetry/mcp-excel-no-telemetry-win-x64.zip
            artifacts/no-telemetry/mcp-excel-no-telemetry-win-x64.zip.sha256
          if-no-files-found: error